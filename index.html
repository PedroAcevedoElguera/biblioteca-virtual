<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Biblioteca Virtual de la IE 121 Virgen de Fatima">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-contenido">
      <div class="marca"><div class="logo">121</div><div><h1 class="titulo-principal">Biblioteca Virtual</h1><p class="subtitulo">IE 121 Virgen de Fatima | EdTech · Ingeniería Educativa</p></div></div>
      <span id="totalLibros" class="total-libros">Cargando...</span>
    </div>
  </header>
  <main class="contenedor">
    <section class="filtros" aria-label="Filtros del catálogo">
      <input id="buscador" class="control" type="search" placeholder="🔍 Buscar por título o autor..." aria-label="Buscar por título o autor">
      <select id="filtroGrado" class="control" aria-label="Filtrar por grado"><option value="">Todos los grados</option><option value="1°">1°</option><option value="2°">2°</option><option value="3°">3°</option><option value="4°">4°</option><option value="5°">5°</option><option value="6°">6°</option><option value="TODOS">Todos</option></select>
      <select id="filtroFormato" class="control" aria-label="Filtrar por formato"><option value="">Físico y digital</option><option value="FISICO">Solo físico</option><option value="DIGITAL">Solo digital</option><option value="AMBOS">Ambos</option></select>
      <select id="filtroTipo" class="control filtro-tipo" aria-label="Filtrar por tipo de texto"><option value="">Todos los tipos</option></select>
    </section>
    <div id="contador" class="contador" aria-live="polite"></div>
    <div id="mensajeError" class="error oculto" role="alert"></div>
    <section id="gridLibros" class="catalogo" aria-label="Catálogo de libros"><div class="cargando"><div class="indicador-carga"></div><div>Cargando biblioteca...</div></div></section>
  </main>
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-ventana"><div class="modal-encabezado"><h2 id="modalTitulo" class="modal-titulo"></h2><div class="modal-acciones"><a id="abrirNuevaPestana" class="abrir-aparte oculto" href="#" target="_blank" rel="noopener noreferrer">Abrir aparte</a><button id="cerrarModal" class="cerrar" type="button" aria-label="Cerrar">✕</button></div></div><div id="modalContent" class="modal-contenido"></div></div>
  </div>
</body>
</html>
